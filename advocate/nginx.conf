events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HTTP блок: нужен для Certbot и редиректа на HTTPS
    server {
        listen 80;
        server_name твой-домен.ru www.твой-домен.ru;

        # Путь для проверки домена Certbot'ом
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всего остального на HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS блок
    server {
        listen 443 ssl http2;
        server_name твой-домен.ru www.твой-домен.ru;

        # Пути к сертификатам (будут созданы после первого запуска Certbot)
        ssl_certificate /etc/letsencrypt/live/твой-домен.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/твой-домен.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Статика
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
        }

        # Медиа
        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # Django
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}