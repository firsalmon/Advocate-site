version: '3.8'

services:
  # --- Django App ---
  web:
    build: .
    restart: unless-stopped
    volumes:
      # Именованный том для SQLite 
      - sqlite_/app/data
      # Тома для статики и медиа 
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    networks:
      - app-network

  # --- Nginx Proxy ---
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Конфиг с хоста
      - ./certbot/conf:/etc/letsencrypt:ro     # Сертификаты
      - ./certbot/www:/var/www/certbot:ro      # Для проверки домена
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - app-network

  # --- Certbot (SSL) ---
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:      # Данные БД
  static_volume:    # CSS/JS/Images
  media_volume:     # Загрузки пользователей